<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scroll2Sport</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Welcome Screen -->
    <section id="welcomeScreen" class="screen active">

        <div class="welcome-container">

            <div class="logo">🏃</div>

            <h1>Scroll<span>2</span>Sport</h1>

            <p class="tagline">
                Scroll less. Move more.
            </p>

            <p class="description">
                Turn your screen time into movement breaks
                that fit your body, schedule, and lifestyle.
            </p>

            <button id="getStartedBtn">
                Get Started →
            </button>

            <p class="small-text">
                Movement for everyone ♿
            </p>

        </div>

    </section>


    <!-- Profile Screen -->
    <section id="profileScreen" class="screen">

        <div class="form-container">

            <div class="form-header">
                <span class="step">STEP 1 OF 2</span>

                <h2>Tell us about you</h2>

                <p>
                    We'll use this information to find
                    movements that work for you.
                </p>
            </div>


            <form id="profileForm">

                <!-- Age -->
                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="13"
                        max="100"
                        placeholder="Enter your age"
                        required
                    >

                </div>


                <!-- Fitness -->
                <div class="form-group">

                    <label for="difficulty">
                        Fitness level
                    </label>

                    <select id="difficulty" required>

                        <option value="">
                            Select your level
                        </option>

                        <option value="Beginner">
                            Beginner
                        </option>

                        <option value="Intermediate">
                            Intermediate
                        </option>

                        <option value="Advanced">
                            Advanced
                        </option>

                    </select>

                </div>
<!-- Goal -->
<div class="form-group">

    <label for="goal">
        What's your goal?
    </label>

    <select id="goal" required>

        <option value="">
            Select your goal
        </option>

        <option value="Stay active">
            Stay active
        </option>

        <option value="Improve fitness">
            Improve fitness
        </option>

        <option value="Reduce screen time">
            Reduce screen time
        </option>

        <option value="Improve mobility">
            Improve mobility
        </option>

    </select>

</div>

                <!-- Movement condition -->
                <div class="form-group">

                    <label for="movementType">
                        How would you like to move?
                    </label>

                    <select id="movementType" required>

                        <option value="">
                            Select an option
                        </option>

                        <option value="Standing">
                            Standing
                        </option>

                        <option value="Seated">
                            Seated
                        </option>

                        <option value="Low Impact">
                            Low impact
                        </option>

                    </select>

                </div>


                <!-- Time -->
                <div class="form-group">

                    <label for="availableTime">
                        How much time do you have?
                    </label>

                    <select id="availableTime" required>

                        <option value="">
                            Select time
                        </option>

                        <option value="3">
                            3 minutes
                        </option>

                        <option value="5">
                            5 minutes
                        </option>

                        <option value="10">
                            10 minutes
                        </option>

                    </select>

                </div>


                <!-- Equipment -->
                <div class="form-group">

                    <label for="equipment">
                        Equipment
                    </label>

                    <select id="equipment" required>

                        <option value="">
                            Select equipment
                        </option>

                        <option value="None">
                            None
                        </option>

                        <option value="Chair">
                            Chair
                        </option>

                        <option value="Mat">
                            Exercise mat
                        </option>

                    </select>

                </div>


                <button type="submit" class="continue-btn">
                    Find My Movement →
                </button>

            </form>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
